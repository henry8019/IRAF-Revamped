[project]
name = "iraf-revamped"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy>=6,<9",
    "numpy>=1.26,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.34",
]

[dependency-groups]
test = ["playwright>=1.65,<2"]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
